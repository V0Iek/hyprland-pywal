# ------------------------------------------
# Colorscheme
# ------------------------------------------
source = ~/.cache/wal/colors-hyprland.conf

# ------------------------------------------
# Background
# ------------------------------------------
background {
  monitor = eDP-1
  path = /$wallpaper

  blur_passes = 3
  blur_size = 5
}

# ------------------------------------------
# Input field
# ------------------------------------------
input-field {
  monitor = eDP-1
  size = 400, 50
  outline_thickness = 0
  inner_color = $background
  font_color = $foreground
  
  position = 0, -50
  halign = center
  valign = center
}

# ------------------------------------------
# Label
# ------------------------------------------
label {
  monitor = eDP-1
  text = cmd[update: 60000] echo $TIME
  color = $color3
  font_family = Fira Sans Semibold
  font_size = 200

  position = 0, 100
  halign = center
  valign = center
}
