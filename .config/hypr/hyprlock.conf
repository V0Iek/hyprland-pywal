# ------------------------------------------
# Colorscheme
# ------------------------------------------
source = ~/.cache/wal/colors-hyprland.conf

# ------------------------------------------
# Background
# ------------------------------------------
background {
  monitor = eDP-1
  path = /$wallpaper

  blur_passes = 3
  blur_size = 5
}

# ------------------------------------------
# Input field
# ------------------------------------------
input-field {
  monitor = eDP-1
  
  size = 250, 50
  
  outline_thickness = 0
  
  inner_color = $color10
  
  font_color = $foreground

  fade_on_empty = false

  placeholder_text = <i> Enter password </i>
  
  position = 0, -50
  halign = center
  valign = center
}

# ------------------------------------------
# Labels
# ------------------------------------------
label {
  monitor = eDP-1
  
  text = cmd[update: 60000] echo $TIME
  
  color = $color14
  
  font_family = Fira Sans Semibold
  font_size = 100

  position = 0, -150
  halign = center
  valign = top
}

label {
  monitor = eDP-1
  
  text = cmd[update:360000] echo $(date "+%A, %d %B")
  
  color = $color14
  
  font_family = Fira Sans Semibold
  font_size = 28

  position = 0, 80
  halign = center
  valign = center
}

label {
  monitor = eDP-1
  
  text = Hi, $USER

  color = $color14
  
  font_family = JetBrains Mono Nerd Font
  font_size = 24

  position = 0, 0
  halign = center
  valign = center
}
